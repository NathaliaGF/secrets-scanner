[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "secrets-scanner"
version = "1.0.0"
description = "Find hard-coded secrets in files, directories, staged changes and Git history. SARIF, pre-commit and GitHub Action ready."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Nathalia Gomes" }]
keywords = ["security", "secrets", "devsecops", "sarif", "pre-commit", "git"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/NathaliaGF/secrets-scanner"
Issues = "https://github.com/NathaliaGF/secrets-scanner/issues"

[project.scripts]
secrets-scanner = "secrets_scanner.cli:main"

[tool.setuptools.packages.find]
include = ["secrets_scanner*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
